feature_config: config/features.yaml (provisional until group approval)
lightgbm_early_stopping:
  metric: sklearn average_precision_score
  patience: 50
  max_rounds: 1500
  weight_rule: '''balanced'' resolves to negative/positive labels in each training
    part'
  note: Per-fit best iteration and resolved weight are in log params._fit.
mlp_training:
  layers: Linear(n, hidden) ReLU Dropout, Linear(hidden, hidden//2) ReLU Dropout,
    Linear(., 1)
  loss: BCEWithLogitsLoss(pos_weight = negatives / positives of the training part)
  optimizer: Adam
  batch_size: 2048
  early_stopping: validation PR-AUC, patience 5, max 40 epochs, best epoch restored
  device: cpu, 4 threads
  note: Per-fit loss and validation PR-AUC by epoch are in log params._fit.
